<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#06090e" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Viewfinder Corner Focus Brackets -->
  <path d="M 11 19 V 11 H 19" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 53 19 V 11 H 45" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 11 45 V 53 H 19" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 53 45 V 53 H 45" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Outer Lens Bezel -->
  <circle cx="32" cy="32" r="20" stroke="url(#ringGrad)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="16" fill="#0a0f18" stroke="#162032" stroke-width="1" />

  <!-- Precision Aperture Iris Blades -->
  <g stroke="#64748b" stroke-width="1.8" stroke-linecap="round">
    <path d="M 32 16 L 44 26" />
    <path d="M 48 25 L 43 40" />
    <path d="M 45 42 L 31 48" />
    <path d="M 32 48 L 20 38" />
    <path d="M 16 39 L 21 24" />
    <path d="M 19 22 L 33 16" />
  </g>

  <!-- Center Luminous Cyan Aperture Focal Point -->
  <circle cx="32" cy="32" r="8" fill="#040810" stroke="url(#lensGrad)" stroke-width="2.2" />
  <circle cx="32" cy="32" r="3.5" fill="#22d3ee" />

  <!-- Specular Lens Glint / Optical Reflection -->
  <path d="M 22 22 A 14 14 0 0 1 38 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>